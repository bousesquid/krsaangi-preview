    <button class="vbtn" id="lbZoom" aria-pressed="false" style="position:static"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5M11 8.5v5M8.5 11h5"/></svg><span>Zoom in</span></button>

  <button class="icon-btn lightbox__arrow lightbox__arrow--n" id="lbNext" aria-label="Next image"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h16m-6-6 6 6-6 6"/></svg></button>

</div>
